<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Next Card Hidden Runtime Architecture</title>
  <desc id="desc">Overall architecture flowchart showing user-facing Next Card flow, hidden input organizing layer, time guardian layer, action review profile layer, runtime control plane, and authority stores.</desc>
  <defs>
    <style>
      .title { font: 700 34px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 500 16px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #4d5a70; }
      .section { font: 700 18px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .label { font: 700 15px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .body { font: 500 13px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #354056; }
      .tiny { font: 500 12px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #4d5a70; }
      .rule { font: 700 13px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #7a3b16; }
      .box { stroke-width: 1.5; rx: 8; ry: 8; }
      .lane { fill: #f8fafc; stroke: #d6deea; stroke-width: 1.5; rx: 8; ry: 8; }
      .user { fill: #e9f7f2; stroke: #82b7a4; }
      .input { fill: #edf5ff; stroke: #7da8dc; }
      .plan { fill: #f7f1ff; stroke: #a98bd2; }
      .time { fill: #fff3e6; stroke: #e2a05f; }
      .proof { fill: #edf8ee; stroke: #7eb987; }
      .profile { fill: #f5eefb; stroke: #b488c9; }
      .control { fill: #fffbea; stroke: #d3b64b; }
      .store { fill: #f6f7f9; stroke: #aeb8c6; }
      .danger { fill: #fff0f0; stroke: #cf8181; }
      .arrow { stroke: #556172; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .softArrow { stroke: #8a6fb1; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowheadPurple); }
      .guardArrow { stroke: #b88736; stroke-width: 2; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrowheadGold); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#556172" />
    </marker>
    <marker id="arrowheadPurple" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#8a6fb1" />
    </marker>
    <marker id="arrowheadGold" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#b88736" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1120" fill="#ffffff" />

  <text x="60" y="58" class="title">Next Card Hidden Runtime Architecture</text>
  <text x="60" y="86" class="subtitle">User sees input / A-B-C Plan Mode / deck / proof. Hidden agents only propose; deterministic services write authoritative state.</text>

  <rect x="40" y="115" width="1520" height="150" class="lane" />
  <text x="60" y="146" class="section">User-Facing Product Loop</text>

  <rect x="70" y="170" width="190" height="62" class="box user" />
  <text x="95" y="195" class="label">Light Input</text>
  <text x="95" y="216" class="body">voice / text / image / PDF</text>

  <rect x="320" y="170" width="190" height="62" class="box plan" />
  <text x="345" y="195" class="label">A/B/C Plan Mode</text>
  <text x="345" y="216" class="body">explicit user choice</text>

  <rect x="570" y="170" width="190" height="62" class="box time" />
  <text x="595" y="195" class="label">Committed Deck</text>
  <text x="595" y="216" class="body">chosen plan only</text>

  <rect x="820" y="170" width="190" height="62" class="box time" />
  <text x="845" y="195" class="label">One Card Runtime</text>
  <text x="845" y="216" class="body">swipe / freeze / burn</text>

  <rect x="1070" y="170" width="190" height="62" class="box proof" />
  <text x="1095" y="195" class="label">Proof</text>
  <text x="1095" y="216" class="body">journal / table / summary</text>

  <rect x="1320" y="170" width="190" height="62" class="box profile" />
  <text x="1345" y="195" class="label">Future Rhythm</text>
  <text x="1345" y="216" class="body">policy hints, not diagnosis</text>

  <path class="arrow" d="M260 201 H310" />
  <path class="arrow" d="M510 201 H560" />
  <path class="arrow" d="M760 201 H810" />
  <path class="arrow" d="M1010 201 H1060" />
  <path class="arrow" d="M1260 201 H1310" />

  <rect x="40" y="300" width="1520" height="520" class="lane" />
  <text x="60" y="331" class="section">Hidden Runtime: Three Capability Domains + Control Plane</text>

  <rect x="70" y="365" width="420" height="300" class="box input" />
  <text x="95" y="398" class="section">Layer 1: Input Organizing</text>
  <text x="95" y="425" class="body">Purpose: turn raw input into confirmed facts</text>
  <rect x="100" y="455" width="160" height="48" class="box input" />
  <text x="118" y="484" class="body">Input Intake</text>
  <rect x="295" y="455" width="160" height="48" class="box input" />
  <text x="311" y="476" class="body">Extraction Worker</text>
  <text x="311" y="492" class="tiny">multimodal adapter</text>
  <rect x="100" y="525" width="160" height="48" class="box input" />
  <text x="118" y="546" class="body">Review Gate</text>
  <text x="118" y="562" class="tiny">evidence binder</text>
  <rect x="295" y="525" width="160" height="48" class="box input" />
  <text x="311" y="546" class="body">Fact Confirmation</text>
  <text x="311" y="562" class="tiny">time / place / event</text>
  <rect x="100" y="595" width="160" height="48" class="box input" />
  <text x="118" y="616" class="body">Task / Time Registry</text>
  <text x="118" y="632" class="tiny">verified facts only</text>
  <rect x="295" y="595" width="160" height="48" class="box input" />
  <text x="311" y="616" class="body">Plan Compiler</text>
  <text x="311" y="632" class="tiny">A/B/C draft only</text>

  <rect x="590" y="365" width="420" height="300" class="box time" />
  <text x="615" y="398" class="section">Layer 2: Time Guardian</text>
  <text x="615" y="425" class="body">Purpose: protect time reality, insert events</text>
  <rect x="620" y="455" width="160" height="48" class="box time" />
  <text x="638" y="476" class="body">Schedule Snapshot</text>
  <text x="638" y="492" class="tiny">versioned view</text>
  <rect x="815" y="455" width="160" height="48" class="box time" />
  <text x="833" y="476" class="body">TimeLock Validator</text>
  <text x="833" y="492" class="tiny">class / exam / DDL</text>
  <rect x="620" y="525" width="160" height="48" class="box time" />
  <text x="638" y="546" class="body">Scheduling Kernel</text>
  <text x="638" y="562" class="tiny">deterministic math</text>
  <rect x="815" y="525" width="160" height="48" class="box time" />
  <text x="833" y="546" class="body">QueueAction</text>
  <text x="833" y="562" class="tiny">validated mutation</text>
  <rect x="620" y="595" width="160" height="48" class="box time" />
  <text x="638" y="616" class="body">Scheduled Events</text>
  <text x="638" y="632" class="tiny">card windows / nudge</text>
  <rect x="815" y="595" width="160" height="48" class="box time" />
  <text x="833" y="616" class="body">Baseline Reminder</text>
  <text x="833" y="632" class="tiny">default target - 30min</text>

  <rect x="1110" y="365" width="420" height="300" class="box profile" />
  <text x="1135" y="398" class="section">Layer 3: Action Review / Rhythm</text>
  <text x="1135" y="425" class="body">Purpose: read proof, adapt future policy</text>
  <rect x="1140" y="455" width="160" height="48" class="box profile" />
  <text x="1158" y="476" class="body">Proof Event Reader</text>
  <text x="1158" y="492" class="tiny">append-only facts</text>
  <rect x="1335" y="455" width="160" height="48" class="box profile" />
  <text x="1353" y="476" class="body">Signal Normalizer</text>
  <text x="1353" y="492" class="tiny">neutral signals</text>
  <rect x="1140" y="525" width="160" height="48" class="box profile" />
  <text x="1158" y="546" class="body">Profile Snapshot</text>
  <text x="1158" y="562" class="tiny">unknown by MVP default</text>
  <rect x="1335" y="525" width="160" height="48" class="box profile" />
  <text x="1353" y="546" class="body">Policy Engine</text>
  <text x="1353" y="562" class="tiny">future hints only</text>
  <rect x="1140" y="595" width="160" height="48" class="box profile" />
  <text x="1158" y="616" class="body">Soft Task Candidate</text>
  <text x="1158" y="632" class="tiny">soft by default</text>
  <rect x="1335" y="595" width="160" height="48" class="box profile" />
  <text x="1353" y="616" class="body">Explanation Builder</text>
  <text x="1353" y="632" class="tiny">support language</text>

  <rect x="180" y="700" width="1240" height="75" class="box control" />
  <text x="215" y="728" class="section">Runtime Control Plane</text>
  <text x="215" y="753" class="rule">Hidden workers propose. Deterministic gates write: review / policy / permission / idempotency / conflict resolution / audit.</text>

  <path class="arrow" d="M490 515 H580" />
  <path class="arrow" d="M1010 515 H1100" />
  <path class="guardArrow" d="M700 665 V695" />
  <path class="guardArrow" d="M895 665 V695" />
  <path class="guardArrow" d="M375 665 V695" />
  <path class="guardArrow" d="M1220 665 V695" />

  <path class="softArrow" d="M1415 525 C1485 525 1490 320 980 320 C780 320 750 340 750 365" />
  <text x="1050" y="313" class="tiny">future policy snapshot feeds Layer 1 / Layer 2</text>

  <rect x="40" y="855" width="1520" height="205" class="lane" />
  <text x="60" y="886" class="section">Authority Stores</text>
  <text x="60" y="912" class="subtitle">Only authorized services write these stores. Agent output cannot bypass them.</text>

  <rect x="70" y="940" width="135" height="48" class="box store" />
  <text x="87" y="962" class="tiny">RawInputStore</text>
  <text x="87" y="978" class="tiny">raw input</text>
  <rect x="220" y="940" width="145" height="48" class="box store" />
  <text x="236" y="962" class="tiny">ExtractionStore</text>
  <text x="236" y="978" class="tiny">candidates</text>
  <rect x="380" y="940" width="130" height="48" class="box store" />
  <text x="396" y="962" class="tiny">TaskRegistry</text>
  <text x="396" y="978" class="tiny">verified task</text>
  <rect x="525" y="940" width="165" height="48" class="box store" />
  <text x="541" y="962" class="tiny">TimeConstraintRegistry</text>
  <text x="541" y="978" class="tiny">TimeLock / DDL</text>
  <rect x="705" y="940" width="125" height="48" class="box store" />
  <text x="721" y="962" class="tiny">DeckStore</text>
  <text x="721" y="978" class="tiny">committed deck</text>
  <rect x="845" y="940" width="150" height="48" class="box store" />
  <text x="861" y="962" class="tiny">CardRuntimeStore</text>
  <text x="861" y="978" class="tiny">card state</text>
  <rect x="1010" y="940" width="145" height="48" class="box store" />
  <text x="1026" y="962" class="tiny">ReminderJobStore</text>
  <text x="1026" y="978" class="tiny">reminder plans</text>
  <rect x="1170" y="940" width="135" height="48" class="box store" />
  <text x="1186" y="962" class="tiny">ProofLedger</text>
  <text x="1186" y="978" class="tiny">append-only</text>
  <rect x="1320" y="940" width="120" height="48" class="box store" />
  <text x="1336" y="962" class="tiny">ProfileStore</text>
  <text x="1336" y="978" class="tiny">snapshots</text>
  <rect x="1455" y="940" width="80" height="48" class="box store" />
  <text x="1467" y="962" class="tiny">Policy</text>
  <text x="1467" y="978" class="tiny">versioned</text>

  <path class="guardArrow" d="M800 775 V850" />

  <rect x="70" y="1025" width="415" height="54" class="box danger" />
  <text x="92" y="1047" class="label">Forbidden</text>
  <text x="92" y="1066" class="tiny">No hidden agent writes hard locks, reminders, proof, deck, card state, or profile directly.</text>

  <rect x="565" y="1025" width="415" height="54" class="box control" />
  <text x="587" y="1047" class="label">Baseline Reminder Rule</text>
  <text x="587" y="1066" class="tiny">Default reminder = target time - 30 minutes; extra nudges are separate.</text>

  <rect x="1060" y="1025" width="415" height="54" class="box user" />
  <text x="1082" y="1047" class="label">User Trust Rule</text>
  <text x="1082" y="1066" class="tiny">If external notification permission is missing, say in-app only.</text>
</svg>
